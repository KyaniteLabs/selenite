name: Plugin gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (includes the needs-no-cleansing requirement)
        run: python -m pip install -r requirements-test.txt && python -m pytest -q
      - name: Desktop event contract
        run: node --experimental-vm-modules tests/test_pane_events.mjs
      - name: Package installs and the fake-gate CLI runs
        run: |
          V=$(mktemp -d) && python -m venv "$V" && "$V/bin/pip" install --no-cache-dir . && "$V/bin/antibeaurocracy" classify "Awaiting ACK from platform"
      - name: install.sh into an empty HOME
        run: |
          H=$(mktemp -d) && mkdir "$H/.claude" && HOME="$H" sh install.sh
          for n in frictionless antibeaurocracy antipedantry; do test -L "$H/.claude/skills/$n"; done
          test -L "$H/.local/bin/antibeaurocracy"
          again=$(HOME="$H" sh install.sh) && printf '%s\n' "$again" | grep "^ok " >/dev/null   # idempotent; grep -q would SIGPIPE install.sh under pipefail
  unit-os:
    # macOS unit-test leg. Catalog/selenite.yaml lists `platforms: [linux, macos]`.
    # No Windows leg: install.sh is POSIX sh and the state files rely on POSIX modes
    # and locks, so Windows is unsupported (Forgejo issue #28).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m pip install pytest==8.4.2 fastapi==0.115.12 httpx==0.28.1 && python -m pytest -q
  hermes-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Checkout tested Hermes runtime
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # v0.23.0
          path: .hermes-runtime
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install Hermes from its own lockfile
        run: uv sync --frozen --python 3.14 --directory .hermes-runtime
      - name: Plugin tests under the Hermes runtime
        run: |
          uv pip install --python .hermes-runtime/.venv/bin/python pytest==8.4.2
          cd plugin && ../.hermes-runtime/.venv/bin/python -m pytest -q
      - name: Real validator receipt (no credentials)
        run: |
          mkdir -p receipts
          HERMES_HOME="$RUNNER_TEMP/hermes-home" .hermes-runtime/.venv/bin/hermes plugins validate plugin --json > receipts/validate.json
          python3 -c 'import json,sys; r=json.load(open("receipts/validate.json")); sys.exit(0 if r.get("ok") is True and not r.get("warnings") else 1)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-validation
          path: receipts/
