# No [build-system] table on purpose: Hermes reads one as "installs Python
# packages" and asks for dependency consent, which leaves a headless install
# disabled. Selenite has no dependencies. `pip install .` still works through
# pip's setuptools fallback.

[project]
name = "selenite"
version = "0.6.0"
description = "Takes friction off the human: steps handed to a person, fake gates between agents, checks that cannot change the decision, and replies that hedge where they could commit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
]

[project.scripts]
# the fake-gate facet keeps the CLI name its users already know
antibeaurocracy = "antibeaurocracy_core.cli:main"

[tool.setuptools]
packages = ["antibeaurocracy_core", "anticowardice_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
