[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "selenite"
version = "0.5.0"
description = "Takes friction off the human: steps handed to a person, fake gates between agents, and checks that cannot change the decision."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
]

[project.scripts]
# the fake-gate facet keeps the CLI name its users already know
antibeaurocracy = "antibeaurocracy_core.cli:main"

[tool.setuptools]
packages = ["antibeaurocracy_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
